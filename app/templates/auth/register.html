{% extends "base.html" %}

{% block title %}Register - Voya{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="text-center mb-4">
        <h1>Create Account</h1>
        <p class="text-muted">Join Voya and start booking amazing trips</p>
    </div>

    <div style="max-width:600px; margin:0 auto;">
        <div class="card card-accent">
            <div class="card-body" style="padding:2rem;">
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="grid grid-2">
                        <div class="field">
                            <label for="first_name">First Name</label>
                            <input type="text" class="input" id="first_name" name="first_name" placeholder="John">
                        </div>
                        <div class="field">
                            <label for="last_name">Last Name</label>
                            <input type="text" class="input" id="last_name" name="last_name" placeholder="Doe">
                        </div>
                    </div>

                    <div class="field">
                        <label for="username">Username <span class="required">*</span></label>
                        <input type="text" class="input" id="username" name="username" placeholder="Choose a username" required>
                    </div>

                    <div class="field">
                        <label for="email">Email <span class="required">*</span></label>
                        <input type="email" class="input" id="email" name="email" placeholder="your@email.com" required>
                    </div>

                    <div class="field">
                        <label for="phone">Phone Number</label>
                        <input type="tel" class="input" id="phone" name="phone" placeholder="+1 (555) 000-0000">
                    </div>

                    <div class="grid grid-2">
                        <div class="field">
                            <label for="password">Password <span class="required">*</span></label>
                            <input type="password" class="input" id="password" name="password" placeholder="••••••••" required>
                        </div>
                        <div class="field">
                            <label for="confirm_password">Confirm <span class="required">*</span></label>
                            <input type="password" class="input" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-main full-width mt-2">
                        <i class="fas fa-check"></i> Create Account
                    </button>
                </form>

                <hr>
                <p class="text-center mb-0 text-muted">
                    Already have an account? <a href="{{ url_for('auth.login') }}">Sign in here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
