{% extends "base.html" %}

{% block title %}Login - Voya{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-head">
            <i class="fas fa-sign-in-alt"></i>
            <h2>Welcome Back</h2>
            <p class="text-muted">Login to your account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" class="input" id="username" name="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" class="input" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-main full-width">
                <i class="fas fa-lock"></i> Login
            </button>
        </form>

        <div class="auth-foot">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
        </div>

        <div class="demo-box">
            <strong>Demo:</strong><br>
            Admin → admin / admin123<br>
            User → customer1 / customer123
        </div>
    </div>
</div>
{% endblock %}
