{% extends "base.html" %}
{% block title %}Add Hotel - Admin{% endblock %}
{% block content %}
<div class="page-wrap">
    <div style="max-width:700px; margin:0 auto;">
        <h1 class="mb-4"><i class="fas fa-plus"></i> Add Hotel</h1>
        <div class="card">
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin.add_hotel') }}">
                    <div class="field"><label for="name">Hotel Name</label><input type="text" class="input" id="name" name="name" required></div>
                    <div class="grid grid-2">
                        <div class="field"><label for="city">City</label><input type="text" class="input" id="city" name="city" required></div>
                        <div class="field"><label for="address">Address</label><input type="text" class="input" id="address" name="address"></div>
                    </div>
                    <div class="field"><label for="description">Description</label><textarea class="input" id="description" name="description" rows="3"></textarea></div>
                    <div class="grid grid-3">
                        <div class="field"><label for="price_per_night">Price/Night</label><input type="number" class="input" id="price_per_night" name="price_per_night" step="0.01" required></div>
                        <div class="field"><label for="rooms">Rooms</label><input type="number" class="input" id="rooms" name="rooms" value="50" required></div>
                        <div class="field"><label for="rating">Rating</label><input type="number" class="input" id="rating" name="rating" step="0.1" min="1" max="5" value="4.0"></div>
                    </div>
                    <div class="field"><label for="amenities">Amenities (comma-separated)</label><input type="text" class="input" id="amenities" name="amenities" placeholder="WiFi, AC, Restaurant, Gym"></div>
                    <div class="gap-row">
                        <button type="submit" class="btn btn-main"><i class="fas fa-save"></i> Add Hotel</button>
                        <a href="{{ url_for('admin.manage_hotels') }}" class="btn btn-ghost">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
