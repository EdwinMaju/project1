{% extends "base.html" %}
{% block title %}Edit Flight - Admin{% endblock %}
{% block content %}
<div class="page-wrap">
    <div style="max-width:700px; margin:0 auto;">
        <h1 class="mb-4"><i class="fas fa-edit"></i> Edit Flight</h1>
        <div class="card">
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin.edit_flight', flight_id=flight.id) }}">
                    <div class="grid grid-2">
                        <div class="field"><label for="flight_number">Flight Number</label><input type="text" class="input" id="flight_number" name="flight_number" value="{{ flight.flight_number }}" required></div>
                        <div class="field"><label for="airline">Airline</label><input type="text" class="input" id="airline" name="airline" value="{{ flight.airline }}" required></div>
                    </div>
                    <div class="grid grid-2">
                        <div class="field"><label for="departure_city">Departure City</label><input type="text" class="input" id="departure_city" name="departure_city" value="{{ flight.departure_city }}" required></div>
                        <div class="field"><label for="arrival_city">Arrival City</label><input type="text" class="input" id="arrival_city" name="arrival_city" value="{{ flight.arrival_city }}" required></div>
                    </div>
                    <div class="grid grid-2">
                        <div class="field"><label for="departure_time">Departure Time</label><input type="datetime-local" class="input" id="departure_time" name="departure_time" value="{{ flight.departure_time.strftime('%Y-%m-%dT%H:%M') }}" required></div>
                        <div class="field"><label for="arrival_time">Arrival Time</label><input type="datetime-local" class="input" id="arrival_time" name="arrival_time" value="{{ flight.arrival_time.strftime('%Y-%m-%dT%H:%M') }}" required></div>
                    </div>
                    <div class="field"><label for="price">Price per Ticket</label><input type="number" class="input" id="price" name="price" step="0.01" value="{{ flight.price }}" required></div>
                    <div class="gap-row">
                        <button type="submit" class="btn btn-main"><i class="fas fa-save"></i> Update Flight</button>
                        <a href="{{ url_for('admin.manage_flights') }}" class="btn btn-ghost"><i class="fas fa-times"></i> Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
